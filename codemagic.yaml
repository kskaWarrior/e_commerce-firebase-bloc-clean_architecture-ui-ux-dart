workflows:
  android_firebase_test_lab:
    name: Android Firebase Test Lab and App Distribution
    instance_type: mac_mini_m2
    max_build_duration: 60

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true

    environment:
      flutter: 3.24.5
      groups:
        - firebase_credentials
      vars:
        FLUTTER_TARGET: "integration_test/main_features_flow_test.dart"
        FIREBASE_PROJECT_ID: "ecommerceapp-auth-db-cleana"
        FIREBASE_ANDROID_APP_ID: "1:502375403738:android:516a5cc31d31f9d3ba15e3"
        FIREBASE_TESTER_GROUPS: "testers"
        FTL_DEVICE_MODEL: "redfin"
        FTL_DEVICE_VERSION: "30"

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Install dependencies
        script: |
          flutter pub get

      - name: Activate brand
        script: |
          dart run tool/activate_brand.dart buybuy

      - name: Static analysis
        script: |
          flutter analyze

      - name: Brand-token tripwire (no hardcoded colors in presentation)
        script: |
          set -euo pipefail
          MATCHES=$(grep -rnE "Colors\.(red|green|blue|orange|purple|pink|brown|yellow|deepPurple|grey)\b|Color\(0x|Color\.fromARGB" lib/presentation lib/common --include="*.dart" --exclude-dir=admin             | grep -v "// tripwire-allow" || true)
          if [ -n "$MATCHES" ]; then
            echo "Hardcoded colors found - use context.brand tokens instead:"
            echo "$MATCHES"
            exit 1
          fi

      - name: Unit and widget tests
        script: |
          flutter test --coverage

      - name: Build Android app and AndroidTest APK for integration_test
        script: |
          set -euo pipefail

          flutter build apk --debug --target=$FLUTTER_TARGET \
            --flavor buybuy \
            --dart-define-from-file=brands/buybuy/brand.json

          cd android
          ./gradlew app:assembleAndroidTest -Ptarget=$FLUTTER_TARGET
          cd ..

          echo "APK files after build:"
          find "$CM_BUILD_DIR/build/app/outputs" "$CM_BUILD_DIR/android/app/build/outputs" -type f -name "*.apk" 2>/dev/null || true

          APP_APK=$(find "$CM_BUILD_DIR/build/app/outputs" "$CM_BUILD_DIR/android/app/build/outputs" \
            -type f \( -name "app-debug.apk" -o -name "app-*-debug.apk" \) \
            2>/dev/null | grep -Ev 'androidTest' | head -n 1 || true)

          TEST_APK=$(find "$CM_BUILD_DIR/build/app/outputs" "$CM_BUILD_DIR/android/app/build/outputs" \
            -type f \( -name "*androidTest*.apk" -o -name "*debug-androidTest*.apk" \) \
            2>/dev/null | head -n 1 || true)

          if [ -z "$APP_APK" ] || [ ! -f "$APP_APK" ]; then
            echo "Failed to locate app debug APK right after build."
            exit 1
          fi

          if [ -z "$TEST_APK" ] || [ ! -f "$TEST_APK" ]; then
            echo "Failed to locate androidTest APK right after build."
            exit 1
          fi

          echo "Resolved app APK: $APP_APK"
          echo "Resolved androidTest APK: $TEST_APK"
          echo "FTL_APP_APK=$APP_APK" >> "$CM_ENV"
          echo "FTL_TEST_APK=$TEST_APK" >> "$CM_ENV"

      - name: Install gcloud CLI
        script: |
          brew install --cask google-cloud-sdk

          if ! command -v gcloud >/dev/null 2>&1; then
            GCLOUD_BIN="$(brew --prefix)/bin/gcloud"
            if [ -x "$GCLOUD_BIN" ]; then
              export PATH="$(brew --prefix)/bin:$PATH"
            fi
          fi

          gcloud --version

      - name: Authenticate gcloud (service account JSON from base64 env var)
        script: |
          if [ -z "$GCLOUD_KEY_FILE" ]; then
            echo "GCLOUD_KEY_FILE is not set. Add it as an app-level base64 environment variable in Codemagic."
            exit 1
          fi

          KEY_FILE="$CM_BUILD_DIR/gcloud-key.json"

          if ! (echo "$GCLOUD_KEY_FILE" | base64 --decode > "$KEY_FILE" 2>/dev/null || echo "$GCLOUD_KEY_FILE" | base64 -D > "$KEY_FILE" 2>/dev/null); then
            echo "Failed to decode GCLOUD_KEY_FILE as base64."
            exit 1
          fi

          if ! grep -q '"type"[[:space:]]*:[[:space:]]*"service_account"' "$KEY_FILE"; then
            echo "Decoded GCLOUD_KEY_FILE is not a valid service account JSON key."
            exit 1
          fi

          gcloud auth activate-service-account --key-file="$KEY_FILE"
          gcloud config set project "$FIREBASE_PROJECT_ID"

      - name: Run integration test in Firebase Test Lab
        script: |
          set -euo pipefail

          if ! command -v gcloud >/dev/null 2>&1; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi

          APP_APK="${FTL_APP_APK:-$CM_BUILD_DIR/build/app/outputs/flutter-apk/app-debug.apk}"
          TEST_APK="${FTL_TEST_APK:-$CM_BUILD_DIR/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk}"

          if [ ! -f "$APP_APK" ]; then
            APP_APK=$(find "$CM_BUILD_DIR/android/app/build/outputs" "$CM_BUILD_DIR/build/app/outputs" \
              -type f \( -name "app-debug.apk" -o -name "app-*-debug.apk" -o -name "*.apk" \) \
              2>/dev/null | grep -E '/(debug|flutter-apk)/' | grep -Ev 'androidTest' | head -n 1 || true)
          fi

          if [ ! -f "$TEST_APK" ]; then
            TEST_APK=$(find "$CM_BUILD_DIR/android/app/build/outputs" "$CM_BUILD_DIR/build/app/outputs" \
              -type f -name "*androidTest*.apk" 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APP_APK" ] || [ ! -f "$APP_APK" ]; then
            echo "Missing app APK. Checked Android output folders:"
            find "$CM_BUILD_DIR/android/app/build/outputs" "$CM_BUILD_DIR/build/app/outputs" -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          if [ -z "$TEST_APK" ] || [ ! -f "$TEST_APK" ]; then
            echo "Missing androidTest APK. Checked Android output folders:"
            find "$CM_BUILD_DIR/android/app/build/outputs" "$CM_BUILD_DIR/build/app/outputs" -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          echo "Using app APK: $APP_APK"
          echo "Using androidTest APK: $TEST_APK"

          SELECTED_MODEL="$FTL_DEVICE_MODEL"
          SELECTED_VERSION="$FTL_DEVICE_VERSION"

          AVAILABLE_MODELS=$(gcloud firebase test android models list --format='value(MODEL_ID)' 2>/dev/null || true)
          if [ -z "$AVAILABLE_MODELS" ]; then
            echo "Unable to list Firebase Test Lab models."
            exit 1
          fi

          if ! echo "$AVAILABLE_MODELS" | grep -qx "$SELECTED_MODEL"; then
            SELECTED_MODEL=$(echo "$AVAILABLE_MODELS" | grep -E '^(redfin|oriole|barbet|sargo)$' | head -n 1)
          fi

          if [ -z "$SELECTED_MODEL" ]; then
            SELECTED_MODEL=$(echo "$AVAILABLE_MODELS" | head -n 1)
          fi

          SUPPORTED_VERSIONS_RAW=$(gcloud firebase test android models describe "$SELECTED_MODEL" --format='value(supportedVersionIds)' 2>/dev/null || true)
          AVAILABLE_VERSIONS=$(echo "$SUPPORTED_VERSIONS_RAW" | tr ',[]' '\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' | grep -E '^[0-9]+$' || true)

          if [ -z "$AVAILABLE_VERSIONS" ]; then
            echo "Unable to resolve supported Firebase Test Lab versions for model: $SELECTED_MODEL"
            echo "Raw supportedVersionIds: $SUPPORTED_VERSIONS_RAW"
            exit 1
          fi

          if ! echo "$AVAILABLE_VERSIONS" | grep -qx "$SELECTED_VERSION"; then
            SELECTED_VERSION=$(echo "$AVAILABLE_VERSIONS" | sort -nr | head -n 1)
          fi

          echo "Using Firebase Test Lab device: model=$SELECTED_MODEL, version=$SELECTED_VERSION"

          gcloud firebase test android run \
            --type instrumentation \
            --app "$APP_APK" \
            --test "$TEST_APK" \
            --device model=$SELECTED_MODEL,version=$SELECTED_VERSION,locale=en,orientation=portrait \
            --timeout 20m

      - name: Build release APK for Firebase App Distribution
        script: |
          flutter build apk --release \
            --flavor buybuy \
            --dart-define-from-file=brands/buybuy/brand.json

      - name: Install Firebase CLI
        script: |
          curl -sL https://firebase.tools | bash
          firebase --version

      - name: Distribute Android release to Firebase App Distribution
        script: |
          RELEASE_APK="$CM_BUILD_DIR/build/app/outputs/flutter-apk/app-buybuy-release.apk"
          KEY_FILE="$CM_BUILD_DIR/gcloud-key.json"

          if [ -z "$GCLOUD_KEY_FILE" ]; then
            echo "GCLOUD_KEY_FILE is not set. It must come from the firebase_credentials group."
            exit 1
          fi

          if ! (echo "$GCLOUD_KEY_FILE" | base64 --decode > "$KEY_FILE" 2>/dev/null || echo "$GCLOUD_KEY_FILE" | base64 -D > "$KEY_FILE" 2>/dev/null); then
            echo "Failed to decode GCLOUD_KEY_FILE as base64 for Firebase CLI auth."
            exit 1
          fi

          if [ ! -f "$RELEASE_APK" ]; then
            echo "Missing release APK: $RELEASE_APK"
            exit 1
          fi

          RELEASE_NOTES="$(git log -1 --pretty=%B 2>/dev/null | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')"
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="${CM_COMMIT_MESSAGE:-Automated build from Codemagic}"
          fi

          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          firebase appdistribution:distribute "$RELEASE_APK" \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "$RELEASE_NOTES"

    artifacts:
      - build/app/outputs/**/*.apk
      - coverage/lcov.info

  ios_simulator_integration:
    name: iOS Simulator Integration Tests
    instance_type: mac_mini_m2
    max_build_duration: 60

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true

    environment:
      flutter: 3.24.5
      xcode: latest
      vars:
        FLUTTER_TARGET: "integration_test/main_features_flow_test.dart"
        IOS_SIMULATOR_NAME: "iPhone 15"

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/ios/Pods

    scripts:
      - name: Install dependencies
        script: |
          flutter pub get

      - name: Activate brand
        script: |
          dart run tool/activate_brand.dart buybuy

      - name: Static analysis
        script: |
          flutter analyze

      - name: Brand-token tripwire (no hardcoded colors in presentation)
        script: |
          set -euo pipefail
          MATCHES=$(grep -rnE "Colors\.(red|green|blue|orange|purple|pink|brown|yellow|deepPurple|grey)\b|Color\(0x|Color\.fromARGB" lib/presentation lib/common --include="*.dart" --exclude-dir=admin             | grep -v "// tripwire-allow" || true)
          if [ -n "$MATCHES" ]; then
            echo "Hardcoded colors found - use context.brand tokens instead:"
            echo "$MATCHES"
            exit 1
          fi

      - name: Unit and widget tests
        script: |
          flutter test --coverage

      - name: Install iOS pods
        script: |
          set -euo pipefail

          if [ ! -f ios/Podfile ]; then
            echo "Missing ios/Podfile. iOS dependencies cannot be resolved without it."
            exit 1
          fi

          if [ ! -f ios/Flutter/Generated.xcconfig ]; then
            echo "Missing ios/Flutter/Generated.xcconfig. Running flutter pub get should create it."
            exit 1
          fi

          rm -rf ios/Pods ios/Podfile.lock
          cd ios
          pod repo update
          pod install --repo-update --verbose
          cd ..

      - name: Prebuild iOS simulator app
        script: |
          set -euo pipefail

          flutter build ios \
            --simulator \
            --debug \
            --no-codesign \
            --target=$FLUTTER_TARGET \
            --dart-define-from-file=brands/buybuy/brand.json

      - name: Boot iOS simulator
        script: |
          xcrun simctl list devices available

          PREFERRED_SIMULATOR_LINE=$(xcrun simctl list devices available | awk -v device="$IOS_SIMULATOR_NAME" '
            /-- iOS / { ios=1; next }
            /^-- / { ios=0 }
            ios && $0 ~ /iPhone/ && $0 ~ device { print; exit }
          ')

          if [ -n "$PREFERRED_SIMULATOR_LINE" ]; then
            SIMULATOR_LINE="$PREFERRED_SIMULATOR_LINE"
          else
            SIMULATOR_LINE=$(xcrun simctl list devices available | awk '
              /-- iOS / { ios=1; next }
              /^-- / { ios=0 }
              ios && $0 ~ /iPhone/ { print; exit }
            ')
          fi

          SIMULATOR_UDID=$(echo "$SIMULATOR_LINE" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          SIMULATOR_NAME=$(echo "$SIMULATOR_LINE" | sed -E 's/^[[:space:]]*([^()]+)[[:space:]]+\(.*/\1/' | sed -E 's/[[:space:]]+$//')

          if [ -z "$SIMULATOR_UDID" ]; then
            echo "Unable to find an available iPhone simulator."
            exit 1
          fi

          echo "Using simulator: $SIMULATOR_NAME ($SIMULATOR_UDID)"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          open -a Simulator
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          flutter devices

      - name: Run integration tests on iOS simulator
        script: |
          set -euo pipefail

          PREFERRED_SIMULATOR_LINE=$(xcrun simctl list devices available | awk -v device="$IOS_SIMULATOR_NAME" '
            /-- iOS / { ios=1; next }
            /^-- / { ios=0 }
            ios && $0 ~ /iPhone/ && $0 ~ device { print; exit }
          ')

          if [ -n "$PREFERRED_SIMULATOR_LINE" ]; then
            SIMULATOR_LINE="$PREFERRED_SIMULATOR_LINE"
          else
            SIMULATOR_LINE=$(xcrun simctl list devices available | awk '
              /-- iOS / { ios=1; next }
              /^-- / { ios=0 }
              ios && $0 ~ /iPhone/ { print; exit }
            ')
          fi

          SIMULATOR_UDID=$(echo "$SIMULATOR_LINE" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "Unable to resolve simulator UDID from available iPhone simulators."
            exit 1
          fi

          LOG_FILE="$CM_BUILD_DIR/flutter_drive_ios.log"
          echo "Running flutter drive on simulator UDID: $SIMULATOR_UDID"

          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=$FLUTTER_TARGET \
            --dart-define-from-file=brands/buybuy/brand.json \
            -d "$SIMULATOR_UDID" \
            --no-dds \
            --verbose 2>&1 | tee "$LOG_FILE"

          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "flutter drive failed with exit code: $EXIT_CODE"
            echo "Last 200 lines from flutter drive log:"
            tail -n 200 "$LOG_FILE" || true
            exit "$EXIT_CODE"
          fi

    artifacts:
      - build/ios/**/*.app
      - build/ios/**/*.xcresult
      - coverage/lcov.info
      - flutter_drive_ios.log

  android_brand_release:
    name: Android brand release (parameterized)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Run manually from the Codemagic UI: pick this workflow and attach the
    # customer's env group brand_<brand> (defines BRAND, CM_KEYSTORE,
    # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD,
    # FIREBASE_ANDROID_APP_ID, FIREBASE_TESTER_GROUPS).

    environment:
      flutter: 3.24.5
      groups:
        - firebase_credentials

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Validate brand parameters
        script: |
          set -euo pipefail
          for var in BRAND CM_KEYSTORE CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD FIREBASE_ANDROID_APP_ID; do
            if [ -z "$(eval echo \${$var:-})" ]; then
              echo "$var is not set - attach the brand_<brand> env group."
              exit 1
            fi
          done
          if [ ! -f "brands/$BRAND/brand.json" ]; then
            echo "Unknown brand: $BRAND (no brands/$BRAND/brand.json)"
            exit 1
          fi

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Activate brand
        script: |
          dart run tool/activate_brand.dart $BRAND

      - name: Decode release keystore
        script: |
          set -euo pipefail
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/upload-keystore.jks"
          echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/upload-keystore.jks" >> $CM_ENV

      - name: Build signed release APK
        script: |
          flutter build apk --release \
            --flavor $BRAND \
            --dart-define-from-file=brands/$BRAND/brand.json

      - name: Install Firebase CLI
        script: |
          curl -sL https://firebase.tools | bash
          firebase --version

      - name: Distribute to Firebase App Distribution
        script: |
          set -euo pipefail
          RELEASE_APK="$CM_BUILD_DIR/build/app/outputs/flutter-apk/app-$BRAND-release.apk"
          KEY_FILE="$CM_BUILD_DIR/gcloud-key.json"

          if [ -z "$GCLOUD_KEY_FILE" ]; then
            echo "GCLOUD_KEY_FILE is not set. It must come from the firebase_credentials group."
            exit 1
          fi
          echo "$GCLOUD_KEY_FILE" | base64 --decode > "$KEY_FILE" 2>/dev/null || echo "$GCLOUD_KEY_FILE" | base64 -D > "$KEY_FILE"

          if [ ! -f "$RELEASE_APK" ]; then
            echo "Missing release APK: $RELEASE_APK"
            exit 1
          fi

          RELEASE_NOTES="$(git log -1 --pretty=%B 2>/dev/null | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')"
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="${CM_COMMIT_MESSAGE:-Automated build from Codemagic}"
          fi

          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          firebase appdistribution:distribute "$RELEASE_APK" \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "${FIREBASE_TESTER_GROUPS:-testers}" \
            --release-notes "$RELEASE_NOTES"

    artifacts:
      - build/app/outputs/**/*.apk
